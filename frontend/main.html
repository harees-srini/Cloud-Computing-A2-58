<!DOCTYPE html>
<html>
<head>
    <title>Music App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial;
            background: #f5f5f5;
        }
        header {
            background: #333;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ddd;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button.remove {
            background: #f44336;
        }
        button.remove:hover {
            background: #da190b;
        }
        .song-item {
            background: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }
        .song-item img {
            width: 100px;
            height: 100px;
            margin-right: 10px;
        }
        a {
            color: #4CAF50;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎵 Music Subscription App</h1>
        <a href="#" onclick="logout()" style="color: white;">Logout</a>
    </header>

    <div class="container">
        <!-- User Area -->
        <div class="section">
            <h2>👤 Your Profile</h2>
            <p id="username">Loading...</p>
        </div>

        <!-- Subscription Area -->
        <div class="section">
            <h2>💫 Your Subscriptions</h2>
            <div id="subscriptions">
                <p>No subscriptions yet</p>
            </div>
        </div>

        <!-- Query Area -->
        <div class="section" style="grid-column: 1 / -1;">
            <h2>🔍 Search Music</h2>
            <input type="text" id="title" placeholder="Song Title">
            <input type="text" id="artist" placeholder="Artist">
            <input type="text" id="album" placeholder="Album">
            <input type="number" id="year" placeholder="Year">
            <button onclick="search()">Search</button>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // Load user info on page load
        window.onload = function() {
            loadUserProfile();
            loadSubscriptions();
        };

        async function loadUserProfile() {
            const email = localStorage.getItem('user');
            try {
                const response = await fetch('http://your-backend-url/user?email=' + email);
                const data = await response.json();
                document.getElementById('username').innerHTML = 
                    `<strong>${data.user_name}</strong><br>Email: ${data.email}`;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadSubscriptions() {
            const email = localStorage.getItem('user');
            try {
                const response = await fetch('http://your-backend-url/subscriptions?email=' + email);
                const subs = await response.json();
                
                const subDiv = document.getElementById('subscriptions');
                if (subs.length === 0) {
                    subDiv.innerHTML = '<p>No subscriptions yet</p>';
                    return;
                }

                let html = '';
                for (let song of subs) {
                    html += `
                        <div class="song-item">
                            <img src="https://your-s3-url/${song.image_url}" alt="Artist">
                            <strong>${song.title}</strong><br>
                            ${song.artist} - ${song.album} (${song.year})
                            <button class="remove" onclick="unsubscribe('${song.title}', '${song.artist}')">Remove</button>
                        </div>
                    `;
                }
                subDiv.innerHTML = html;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function search() {
            const title = document.getElementById('title').value;
            const artist = document.getElementById('artist').value;
            const album = document.getElementById('album').value;
            const year = document.getElementById('year').value;

            if (!title && !artist && !album && !year) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Please fill at least one field</p>';
                return;
            }

            try {
                const response = await fetch('http://your-backend-url/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title, artist, album, year: year ? parseInt(year) : null})
                });

                const songs = await response.json();
                const resultsDiv = document.getElementById('results');

                if (songs.length === 0) {
                    resultsDiv.innerHTML = '<p style="color: red;">No results found</p>';
                    return;
                }

                let html = '';
                for (let song of songs) {
                    html += `
                        <div class="song-item">
                            <img src="https://your-s3-url/${song.image_url}" alt="Artist">
                            <strong>${song.title}</strong><br>
                            ${song.artist} - ${song.album} (${song.year})
                            <button onclick="subscribe('${song.title}', '${song.artist}')">Subscribe</button>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
            } catch (error) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Error searching</p>';
            }
        }

        async function subscribe(title, artist) {
            const email = localStorage.getItem('user');
            try {
                await fetch('http://your-backend-url/subscribe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, title, artist})
                });
                loadSubscriptions();
                alert('Added to your subscriptions!');
            } catch (error) {
                alert('Error subscribing');
            }
        }

        async function unsubscribe(title, artist) {
            const email = localStorage.getItem('user');
            try {
                await fetch('http://your-backend-url/unsubscribe', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, title, artist})
                });
                loadSubscriptions();
                alert('Removed from subscriptions');
            } catch (error) {
                alert('Error unsubscribing');
            }
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
